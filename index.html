<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>City Drive 3D</title>
<style>
:root{--card:#fff;--text:#1d2530;--accent:#e5484d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1b2129;--text:#e8edf2;color-scheme:dark}}
:root[data-theme="dark"]{--card:#1b2129;--text:#e8edf2;color-scheme:dark}
html,body{height:100%;margin:0;background:#9ec9ee;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#game{position:relative;width:100%;height:100%;touch-action:none}
canvas{display:block}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:10px;font-weight:600;font-size:1rem}
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35)}
.over[hidden]{display:none}
.card{background:var(--card);color:var(--text);padding:22px 26px;border-radius:16px;text-align:center;max-width:320px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.card h1{margin:0 0 8px;font-size:1.5rem}
.card p{margin:6px 0;font-size:.95rem;opacity:.85}
.card button{margin-top:10px;font:inherit;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 26px;cursor:pointer}
.pad{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}
.pad div{display:flex;gap:10px;pointer-events:auto}
.pad button{width:64px;height:64px;border:0;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:1.5rem;touch-action:none;user-select:none}
@media (hover:hover) and (pointer:fine){.pad{display:none}}
</style>
</head>
<body>
<div id="game">
  <div class="hud"><span class="chip">Монеты: <span id="sc">0</span></span><span class="chip">⏱ <span id="tm">60</span></span><span class="chip"><span id="sp">0</span> км/ч</span></div>
  <div class="over" id="over"><div class="card"><h1>🚗 City Drive 3D</h1><p id="msg">Собирайте золотые монеты по городу. Каждая даёт +4 секунды.</p><p>W/S или ↑/↓ — газ и тормоз<br>A/D или ←/→ — руль · Пробел — ручник</p><button id="go">Поехали</button></div></div>
  <div class="pad"><div><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><div><button data-k="ArrowDown">▼</button><button data-k="ArrowUp">▲</button></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
var P=54,K=3,B=P*(K+0.5),keys={},best=0;
try{best=+localStorage.getItem('citydrive-best')||0}catch(e){}
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space')e.preventDefault()});
addEventListener('keyup',function(e){keys[e.code]=false});
document.querySelectorAll('.pad button').forEach(function(b){
  var k=b.dataset.k;
  b.addEventListener('pointerdown',function(e){e.preventDefault();keys[k]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(function(t){b.addEventListener(t,function(){keys[k]=false})});
});
var box=document.getElementById('game'),R=new THREE.WebGLRenderer({antialias:true});
box.insertBefore(R.domElement,box.firstChild);
R.setPixelRatio(Math.min(devicePixelRatio,2));
var S=new THREE.Scene();S.background=new THREE.Color(0x9ec9ee);S.fog=new THREE.Fog(0x9ec9ee,90,330);
var cam=new THREE.PerspectiveCamera(65,1,0.5,500);
S.add(new THREE.HemisphereLight(0xffffff,0x556677,0.95));
var sun=new THREE.DirectionalLight(0xffffff,0.6);sun.position.set(60,100,40);S.add(sun);
function mat(c){return new THREE.MeshLambertMaterial({color:c})}
function add(w,h,d,c,x,y,z,p){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);(p||S).add(m);return m}
var g=new THREE.Mesh(new THREE.PlaneGeometry(2*B+300,2*B+300),mat(0x34373c));g.rotation.x=-Math.PI/2;S.add(g);
var cols=[0x7a8896,0x8c97a3,0x6b7d92,0x9aa5b1,0xa3836a,0x5f6e7d],boxes=[],i,j,a,b;
for(i=-K;i<=K;i++)for(j=-K;j<=K;j++){
  add(40,0.4,40,0x8d949b,i*P,0.2,j*P);
  for(a=-1;a<=1;a+=2)for(b=-1;b<=1;b+=2){
    if(Math.random()<0.12){add(14,0.6,14,0x4f9d5b,i*P+a*10,0.3,j*P+b*10);continue}
    var h=8+Math.random()*Math.random()*45,cx=i*P+a*10,cz=j*P+b*10;
    add(16,h,16,cols[Math.floor(Math.random()*cols.length)],cx,h/2+0.4,cz);
    boxes.push([cx-8,cx+8,cz-8,cz+8]);
  }
}
for(i=-4;i<=3;i++){var c=(i+0.5)*P;add(0.4,0.05,2*B,0xe8d36a,c,0.03,0);add(2*B,0.05,0.4,0xe8d36a,0,0.03,c)}
var car=new THREE.Group();
add(2.2,0.8,4.4,0xe5484d,0,0.9,0,car);add(1.8,0.7,2.2,0xcfe8ff,0,1.6,-0.2,car);
[[-1.15,1.4],[1.15,1.4],[-1.15,-1.4],[1.15,-1.4]].forEach(function(p){
  var w=new THREE.Mesh(new THREE.CylinderGeometry(0.45,0.45,0.4,12),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(p[0],0.45,p[1]);car.add(w)});
S.add(car);
function spawn(){var c=(Math.floor(Math.random()*8)-3.5)*P,t=(Math.random()*2-1)*(B-12);return Math.random()<0.5?{x:c,z:t}:{x:t,z:c}}
var coins=[];
for(i=0;i<14;i++){
  var cg=new THREE.CylinderGeometry(1.1,1.1,0.3,18);cg.rotateZ(Math.PI/2);
  var cm=new THREE.Mesh(cg,new THREE.MeshLambertMaterial({color:0xffc107,emissive:0x996600}));
  var p=spawn();cm.position.set(p.x,2,p.z);S.add(cm);coins.push(cm);
}
var x,z,h,v,score,time,running=false,last=0;
var $=function(id){return document.getElementById(id)};
function reset(){x=P/2;z=-20;h=0;v=0;score=0;time=60;$('sc').textContent=0}
reset();
function end(){
  running=false;
  if(score>best){best=score;try{localStorage.setItem('citydrive-best',String(best))}catch(e){}}
  $('msg').textContent='Время вышло! Монет: '+score+' · Рекорд: '+best;
  $('go').textContent='Ещё раз';$('over').hidden=false;
}
$('go').onclick=function(){reset();running=true;$('over').hidden=true};
function resize(){var w=box.clientWidth,hh=box.clientHeight;R.setSize(w,hh);cam.aspect=w/hh;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function step(dt){
  var up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown,lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;
  if(up)v+=28*dt;
  if(dn)v-=(v>0?45:18)*dt;
  if(keys.Space)v-=Math.sign(v)*Math.min(Math.abs(v),50*dt);
  if(!up&&!dn)v-=Math.sign(v)*Math.min(Math.abs(v),8*dt);
  v-=v*0.4*dt;v=Math.max(-12,Math.min(42,v));
  h+=((lf?1:0)-(rt?1:0))*1.9*dt*Math.max(-1,Math.min(1,v/8));
  x+=Math.sin(h)*v*dt;z+=Math.cos(h)*v*dt;
  var L=B-2;x=Math.max(-L,Math.min(L,x));z=Math.max(-L,Math.min(L,z));
  for(var k=0;k<boxes.length;k++){
    var q=boxes[k],px=Math.max(q[0],Math.min(x,q[1])),pz=Math.max(q[2],Math.min(z,q[3])),dx=x-px,dz=z-pz,d=Math.hypot(dx,dz);
    if(d<2&&d>0.001){x=px+dx/d*2;z=pz+dz/d*2;v*=0.6}
  }
  time-=dt;$('tm').textContent=Math.max(0,Math.ceil(time));
  if(time<=0)end();
  coins.forEach(function(c){
    if(Math.hypot(c.position.x-x,c.position.z-z)<3.4){
      var p=spawn();c.position.x=p.x;c.position.z=p.z;score++;time+=4;$('sc').textContent=score}
  });
}
function loop(t){
  requestAnimationFrame(loop);
  var dt=Math.min(0.05,(t-last)/1000||0);last=t;
  if(running)step(dt);
  coins.forEach(function(c){c.rotation.y+=2*dt});
  car.position.set(x,0,z);car.rotation.y=h;
  var fx=Math.sin(h),fz=Math.cos(h),tp=new THREE.Vector3(x-fx*13,6.5,z-fz*13);
  cam.position.lerp(tp,1-Math.exp(-6*dt));
  cam.lookAt(x+fx*5,1.5,z+fz*5);
  $('sp').textContent=Math.round(Math.abs(v)*3.6);
  R.render(S,cam);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
